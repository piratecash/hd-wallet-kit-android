name: Publish Maven artifacts to GitHub Pages

on:
  push:
    tags: ['**']

permissions:
  contents: write

concurrency:
  group: publish-maven-gh-pages
  cancel-in-progress: false

jobs:
  verify-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate canonical numeric SemVer tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be exact numeric SemVer: MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "VERSION_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Verify Android target
        run: ./gradlew testDebugUnitTest
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ env.VERSION_NAME }}

  verify-desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew desktopTest

  publish:
    needs: [verify-android, verify-desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate canonical numeric SemVer tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be exact numeric SemVer: MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "VERSION_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Publish locally and resolve as a consumer
        run: ./gradlew publishAllPublicationsToLocalBuildRepository && ./gradlew -p consumer-smoke compileKotlinDesktop compileDebugKotlinAndroid
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ env.VERSION_NAME }}
          ORG_GRADLE_PROJECT_HD_WALLET_VERSION: ${{ env.VERSION_NAME }}

      - name: Prepare GitHub Pages checkout
        shell: bash
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages || {
            git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf .
          }

      - name: Add Maven artifacts and push normally
        shell: bash
        run: |
          cp -R build/maven-repo/. gh-pages/
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish $VERSION_NAME"
          git push origin gh-pages
